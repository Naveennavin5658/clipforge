services:
  clipforge-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: clipforge-backend
    restart: unless-stopped
    environment:
      - PORT=7860
      - MAX_CONCURRENT_JOBS=3
      - ALLOWED_ORIGINS=*
    ports:
      - "127.0.0.1:7860:7860"
    tmpfs:
      - /tmp:size=512M,mode=1777

  caddy:
    image: caddy:2-alpine
    container_name: clipforge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - clipforge-backend

volumes:
  caddy_data:
  caddy_config:
